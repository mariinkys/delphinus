[package]
name = "delphinus"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8.23"
leptos_router = "0.8.17"
leptos_meta = "0.8.7"
leptos_axum = { version = "0.8.10", optional = true }
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1.54", optional = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
memmap2 = { version = "0.9.12", optional = true }
memchr = { version = "2.7", optional = true }
oar-ocr = { version = "0.10.2", optional = true, default-features = false, features = ["simd"] }
image = { version = "0.25.10", optional = true, default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Clipboard", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DragEvent", "Element", "File", "FileList", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlDialogElement", "HtmlInputElement", "HtmlTextAreaElement", "InputEvent", "CompositionEvent", "ImageBitmap", "CanvasRenderingContext2d", "Navigator", "Request", "RequestInit", "Response", "Storage", "Url", "Window", "ClipboardEvent", "KeyboardEvent", "MediaQueryList", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageEncodeOptions", "Headers"] }

[features]
hydrate = ["leptos/hydrate"]
ssr = [
  "dep:leptos_axum", "dep:axum", "dep:tokio", "dep:memmap2", "dep:memchr",
  "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr",
]
# OCR with an ONNX Runtime you provide (ORT_LIB_PATH + ORT_PREFER_DYNAMIC_LINK=1)
ocr = ["ssr", "dep:oar-ocr", "dep:image"]
# OCR with ONNX Runtime downloaded and linked statically at build time (Docker)
ocr-bundled = ["ocr", "oar-ocr/download-binaries"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Size-optimised profile for the WASM bundle
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

[package.metadata.leptos]
output-name = "delphinus"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "assets"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
hash-files = false
